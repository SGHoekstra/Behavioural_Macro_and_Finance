name: Build and deploy course site

# Deploys to gh-pages. The `output` branch holds the archived Fall23 site
# built from archive-2024 and must not be touched.
permissions:
  contents: write

on:
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'
      - 'plans/**'
  workflow_dispatch:

concurrency:
  group: build-site
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    # Notebook 05 renders its saved demonstration plots without Python training.
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - name: Install Julia
        uses: julia-actions/setup-julia@v2
        with:
          # Match the tutorial Manifest's Julia version for reproducible exports.
          version: '1.12.1'

      # Pluto's notebook state cache: keyed on the tutorial Manifest, so the
      # expensive BeforeIT runs are reused until dependencies change.
      - name: Cache notebook states
        uses: actions/cache@v4
        with:
          path: PlutoPages/_cache
          # Keyed on the Python environment as well as the Julia one. PlutoSliderServer
          # keys each cached state on the NOTEBOOK's content, so fixing a broken
          # environment does not invalidate a state that failed because of it —
          # notebook 05 kept serving a cached Python 3.14 ImportError after the
          # interpreter was pinned. There is deliberately no bare catch-all
          # restore-key: it matched any previous cache and dragged the bad state back.
          key: ${{ runner.os }}-pluto-state-v2-${{ hashFiles('pluto_tutorial/Manifest.toml', 'pluto_tutorial/CondaPkg.toml') }}-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-pluto-state-v2-${{ hashFiles('pluto_tutorial/Manifest.toml', 'pluto_tutorial/CondaPkg.toml') }}

      - name: Cache Julia depot
        uses: actions/cache@v4
        with:
          path: ~/.julia
          key: ${{ runner.os }}-julia-v1-${{ hashFiles('**/Manifest.toml') }}
          restore-keys: |
            ${{ runner.os }}-julia-v1-

      # The notebooks activate pluto_tutorial/ but never instantiate it.
      # On a fresh runner that environment has no packages installed, so every
      # notebook renders empty. Locally this is invisible: the depot already
      # has them.
      - name: Instantiate the tutorial environment
        run: julia --project=pluto_tutorial -e 'using Pkg; Pkg.instantiate()'

      - name: Verify CANVAS boundary decisions
        run: julia --project=pluto_tutorial PlutoPages/tools/check_canvas_boundaries.jl

      # Notebook 05 publishes in reading mode. Its optional local Python
      # environment is not initialized by the website build.
      - name: Sync course material into content/
        run: julia PlutoPages/sync_content.jl

      - name: Generate site
        run: |
          julia --project=PlutoPages/pluto-deployment-environment -e '
            import Pkg; Pkg.instantiate();
            include("./PlutoPages/generate.jl")'

      # generate.jl only inspects its own cells, so a content notebook whose
      # first cell throws still exits 0 and ships a site of empty shells.
      - name: Verify notebooks actually rendered
        run: julia --project=PlutoPages/pluto-deployment-environment PlutoPages/check_build.jl

      - name: Upload generation report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: generation-report
          path: |
            generation_report.html
            PlutoPages/_site/generated_assets/*.plutostate

      # The 2024 course site lives on the output branch, which was the previous
      # Pages source. Copy it into the build so it stays reachable at /Fall23/
      # once Pages points here. The output branch itself is never written to.
      - name: Preserve the archived Fall23 site
        run: |
          git fetch --depth=1 origin output
          git archive origin/output Fall23 | tar -x -C PlutoPages/_site
          test -f PlutoPages/_site/Fall23/index.html

      - name: Deploy to gh-pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: PlutoPages/_site
